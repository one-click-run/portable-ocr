name: Build portable-ocr

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portable-ocr-release
  cancel-in-progress: false

jobs:
  version:
    name: Check project version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build only unpublished versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("portable-ocr.csproj").findtext("./PropertyGroup/Version", ""))')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid project version: $version" >&2
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq "$tag" <<< "$releases"; then
            echo "Release $tag already exists; skipping packaging."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              if [[ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]]; then
                echo "Tag $tag already points to another commit. Choose a new project version." >&2
                exit 1
              fi
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.runtime }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-2022
          - runtime: osx-x64
            os: macos-15-intel
          - runtime: osx-arm64
            os: macos-15
          - runtime: linux-x64
            os: ubuntu-22.04
          - runtime: linux-arm64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: portable-ocr-${{ matrix.runtime }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish new version
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-ocr-*
          path: packages
          merge-multiple: true
      - name: Publish all platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" packages/* \
            --target "$GITHUB_SHA" --title "portable-ocr $RELEASE_TAG" \
            --generate-notes
